    question: `A ladder leans against a wall forming a 72° angle with the ground. The base of the ladder is 5.2 feet from the wall. What is the length of the ladder?<br>
    <br>
    <em>(Round to the nearest tenth.)</em>`,
    options: [
      "A) 15.8 ft",
      "B) 17.0 ft",
      "C) 16.9 ft",
      "D) 18.2 ft",
      "E) 19.2 ft"
    ],
    answer: 2,
    explanation: `Let the length of the ladder be \( L \). The horizontal distance (adjacent) to the wall is 5.2 ft. The angle with ground is 72°.<br>
    \( \cos(72^\circ) = \frac{5.2}{L} \Rightarrow L = \frac{5.2}{\cos(72^\circ)} \)<br>
    \( \cos(72^\circ) \approx 0.3090 \) so \( L \approx \frac{5.2}{0.3090} \approx 16.835 \) ft.<br>
    Rounded to the nearest tenth: <b>16.9 ft (C)</b>`
  },

    \( x + 1 = -x + 5 ⇒ 2x = 4 ⇒ x = 2 \)<br>
    \( y = 2 + 1 = 3 \)<br>
    So intersection (2, 3): distance = \( \sqrt{4 + 9} = \sqrt{13} ≈ 3.6 \).<br>

  {
    question: `A train travels the first 80 miles of a journey at 40 mph, and the next 120 miles at 60 mph. What is the average speed (in mph) for the entire trip?`,
