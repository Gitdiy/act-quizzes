<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ACT Math Practice Quiz</title>
<style>
    body {
        background: #f5f6fa;
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 480px;
        margin: 40px auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(100,100,150,0.09);
        padding: 24px 18px 34px 18px;
    }
    h1 {
        margin-bottom: 18px;
        font-size: 2em;
        color: #33384d;
        font-weight: 600;
        text-align: center;
    }
    .score {
        color: #2563eb;
        font-weight: 500;
        font-size: 1.2em;
        text-align: center;
        margin-bottom: 14px;
    }
    .question-num {
        font-size: 1em;
        color: #7b7b9d;
        margin-bottom: 8px;
        text-align: center;
    }
    .question-text {
        font-size: 1.1em;
        color: #1b2028;
        font-weight: 500;
        margin-bottom: 12px;
        text-align: left;
    }
    .choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
    }
    .choice-btn {
        appearance: none;
        background: #ecf1fa;
        border: none;
        border-radius: 8px;
        color: #30335c;
        padding: 12px 15px;
        font-size: 1em;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.18s;
        box-shadow: 0 1px 8px 0 rgba(140,160,220,0.07);
    }
    .choice-btn:hover:not(.disabled) {
        background: #dbe9ff;
    }
    .choice-btn.correct {
        background: #aeeab7;
        color: #1b2f1f;
    }
    .choice-btn.incorrect {
        background: #ffd1d1;
        color: #a01b1b;
    }
    .choice-btn.disabled {
        cursor: default;
        opacity: 0.65;
    }
    .feedback {
        font-size: 1em;
        font-weight: 500;
        margin-bottom: 8px;
        text-align: left;
    }
    .feedback.correct {
        color: #249d2f;
    }
    .feedback.incorrect {
        color: #df2323;
    }
    .explanation {
        font-size: 0.96em;
        color: #333;
        background: #f3f5ff;
        border-radius: 7px;
        padding: 9px 12px;
        margin-bottom: 18px;
        margin-top: -3px;
    }
    .next-btn {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        padding: 12px 20px;
        margin-top: 7px;
        cursor: pointer;
        transition: background 0.18s;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    .next-btn:hover {
        background: #1836a3;
    }
    .result {
        text-align: center;
        font-size: 1.25em;
        font-weight: 700;
        color: #2b2b52;
        margin-top: 28px;
        margin-bottom: 10px;
    }
    @media (max-width: 550px) {
        .container { padding-left: 7px;padding-right:7px;}
        h1 { font-size: 1.5em;}
        .question-text { font-size: 1.04em;}
        .choice-btn { font-size: 0.97em;padding:11px 9px;}
    }
</style>
</head>
<body>
<div class="container">
    <h1>ACT Math Practice Quiz</h1>
    <div class="score" id="score">Score: 0/0</div>
    <div id="quiz-area">
        <!-- Quiz content will appear here -->
    </div>
</div>

<script>
const questions = [
    {
        topic: "Algebra (Medium)",
        question: "Solve for x: 3x - 5 = 2x + 7.",
        choices: [
            "x = 2",
            "x = 12",
            "x = -12",
            "x = -2",
            "x = 0"
        ],
        answer: 0,
        explanation: "Subtract 2x from both sides: 3x - 5 - 2x = 2x + 7 - 2x → x - 5 = 7. Add 5: x = 12."
    },
    {
        topic: "Geometry (Easy)",
        question: "What is the area of a triangle with a base of 8 and a height of 5?",
        choices: [
            "40",
            "13",
            "20",
            "16",
            "45"
        ],
        answer: 2,
        explanation: "Area = (1/2) × base × height = (1/2) × 8 × 5 = 20."
    },
    {
        topic: "Trigonometry (Hard)",
        question: "If sin θ = 0.6 and θ is acute, what is cos θ?",
        choices: [
            "0.8",
            "0.92",
            "0.4",
            "0.36",
            "0.6"
        ],
        answer: 0,
        explanation: "sin²θ + cos²θ = 1 ⇒ cos²θ = 1 - (0.6)² = 1 - 0.36 = 0.64 ⇒ cos θ = √0.64 = 0.8."
    },
    {
        topic: "Statistics (Medium)",
        question: "What is the median of: 8, 3, 10, 1, 7?",
        choices: [
            "3",
            "7",
            "8",
            "10",
            "5"
        ],
        answer: 1,
        explanation: "Ordering: 1, 3, 7, 8, 10. Median is the middle value, which is 7."
    },
    {
        topic: "Pre-Algebra (Easy)",
        question: "What is 4 × (3 + 2)?",
        choices: [
            "14",
            "20",
            "10",
            "24",
            "12"
        ],
        answer: 1,
        explanation: "(3 + 2) = 5, then 4 × 5 = 20."
    },
    {
        topic: "Exponents (Medium)",
        question: "Which is equivalent to 2<sup>4</sup> × 2<sup>3</sup>?",
        choices: [
            "2<sup>7</sup>",
            "2<sup>12</sup>",
            "2<sup>1</sup>",
            "2<sup>8</sup>",
            "2<sup>6</sup>"
        ],
        answer: 0,
        explanation: "Add exponents: 4 + 3 = 7, so 2<sup>7</sup>."
    },
    {
        topic: "Coordinate Geometry (Hard)",
        question: "What is the distance between (−2, 5) and (4, −1)?",
        choices: [
            "8",
            "√40",
            "10",
            "√72",
            "6√2"
        ],
        answer: 1,
        explanation: "Distance = √[(4+2)² + (−1−5)²] = √[(6)² + (−6)²] = √[36 + 36] = √72 = √(36×2) = 6√2, which is ≈8.49. However, none of the options match this, except √72 (option 3), but since option 1 is √40, let's check: (4+2)²=36, (−1−5)²=36, sum=72 ⇒ correct answer is √72, so answer is 3.<br>The quiz expects answer 1, so explanation should match. Let's correct:<br>Distance = √[(4+2)² + (−1−5)²] = √[36 + 36] = √72 = 6√2. 6√2 is option 4."
    },
    {
        topic: "Inequalities (Medium)",
        question: "Which of the following is the solution to: 2x + 8 > 4x − 2?",
        choices: [
            "x < 5",
            "x > 5",
            "x < −5",
            "x > −5",
            "x > 3"
        ],
        answer: 3,
        explanation: "Subtract 2x: 8 > 2x − 2. Add 2: 10 > 2x → 5 > x ⇒ x < 5. But the solution in choices x > −5 fits when we subtract 4x from both sides: 2x + 8 > 4x − 2 ⇒ 8 + 2 > 4x − 2x, confirming x > −5."
    },
    {
        topic: "Algebra (Hard)",
        question: "If f(x) = x² − 3x + 5, what is f(−2)?",
        choices: [
            "9",
            "15",
            "7",
            "1",
            "3"
        ],
        answer: 0,
        explanation: "f(−2) = (−2)² − 3×(−2) + 5 = 4 + 6 + 5 = 15. Correct answer is 15."
    },
    {
        topic: "Geometry (Medium)",
        question: "A rectangle has a length twice as great as its width. If its perimeter is 54, what is its area?",
        choices: [
            "162",
            "108",
            "72",
            "216",
            "54"
        ],
        answer: 1,
        explanation: "Let width = x, length = 2x. Perimeter = 2x + 2(2x) = 6x = 54 ⇒ x = 9. Area = x × 2x = 9 × 18 = 162."
    }
];

// Corrections to explanations/answers as necessary:
questions[6].answer = 3; // Distance between points; answer is 6√2
questions[6].explanation = "Distance = √[(4 + 2)² + (−1 − 5)²] = √[6² + (−6)²] = √[36 + 36] = √72 = 6√2.";
questions[7].answer = 0; // Correct answer, x < 5
questions[7].explanation = "Subtract 2x from both sides: 2x + 8 > 4x − 2 ⇒ 8 > 2x − 2. Add 2: 10 > 2x ⇒ 5 > x, so x < 5.";
questions[8].answer = 1; // Correct answer, 15
questions[8].explanation = "f(−2) = (−2)² − 3×(−2) + 5 = 4 + 6 + 5 = 15.";
questions[9].answer = 0; // Correct answer, 162
questions[9].explanation = "Let width = x, length = 2x. Perimeter = 2x + 2(2x) = 6x = 54 ⇒ x = 9. Area = x × 2x = 9 × 18 = 162.";

let current = 0;
let score = 0;

function renderQuestion() {
    const q = questions[current];
    document.getElementById('score').textContent = `Score: ${score}/${current}`;
    let html = '';
    html += `<div class="question-num">Question ${current+1} of ${questions.length} <span style="font-size:0.95em;color:#9293a7;">(${q.topic})</span></div>`;
    html += `<div class="question-text">${q.question}</div>`;
    html += `<div class="choices">`;
    q.choices.forEach((choice, idx) => {
        html += `<button class="choice-btn" onclick="selectAnswer(${idx})" id="choice-${idx}">${String.fromCharCode(65+idx)}. ${choice}</button>`;
    });
    html += `</div>`;
    html += `<div id="feedback"></div>`;
    document.getElementById('quiz-area').innerHTML = html;
}

function selectAnswer(idx) {
    const q = questions[current];
    let feedbackDiv = document.getElementById('feedback');
    let allBtns = document.querySelectorAll('.choice-btn');
    allBtns.forEach(btn => btn.classList.add('disabled'));
    let correctIdx = q.answer;
    if(idx === correctIdx) {
        feedbackDiv.innerHTML = `<div class="feedback correct">Correct!</div><div class="explanation">${q.explanation}</div>`;
        allBtns[idx].classList.add('correct');
        score++;
    } else {
        feedbackDiv.innerHTML = `<div class="feedback incorrect">Incorrect. The correct answer is ${String.fromCharCode(65+correctIdx)}.<br></div><div class="explanation">${q.explanation}</div>`;
        allBtns[idx].classList.add('incorrect');
        allBtns[correctIdx].classList.add('correct');
    }
    document.getElementById('score').textContent = `Score: ${score}/${current+1}`;
    feedbackDiv.innerHTML += `<button class="next-btn" onclick="nextQuestion()">Next</button>`;
}

function nextQuestion() {
    current++;
    if(current < questions.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('score').textContent = `Final Score: ${score}/${questions.length}`;
    let percent = Math.round(100 * score / questions.length);
    let msg = "";
    if (percent >= 90) msg = "Awesome!";
    else if (percent >= 75) msg = "Great!";
    else if (percent >= 50) msg = "Good effort!";
    else msg = "Keep practicing!";
    document.getElementById('quiz-area').innerHTML = `<div class="result">You scored ${score} out of ${questions.length} (${percent}%).<br>${msg}</div>`;
}

renderQuestion();
</script>
</body>
</html>
