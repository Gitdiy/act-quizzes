<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACT Practice: May 27, 2026 (Hard)</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: #f8fafc;
            color: #222;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 720px;
            margin: 32px auto;
            background: #fff;
            padding: 24px 16px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(43, 70, 120, 0.08);
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .score {
            font-size: 1.2rem;
            text-align: right;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .question-block {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .question-number {
            font-size: 1rem;
            font-weight: bold;
            color: #47abea;
        }
        .question-text {
            font-size: 1.1rem;
            margin: 8px 0 16px 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 1rem;
            background: #e8eef2;
            color: #333;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }
        .option-btn.correct {
            background: #67d99e;
            color: #fff;
        }
        .option-btn.incorrect {
            background: #ed6060;
            color: #fff;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .explanation {
            margin-top: 16px;
            background: #f4f7fa;
            border-left: 4px solid #47abea;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 6px;
        }
        @media (max-width: 650px) {
            .container {
                border-radius: 0;
                padding: 12px 4px;
            }
        }
        .final-score {
            font-size: 1.4rem;
            text-align: center;
            background: #bef5ff;
            color: #0e374b;
            padding: 16px;
            border-radius: 8px;
            margin-top: 22px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .restart-btn {
            display: block;
            margin: 24px auto 0 auto;
            background: #47abea;
            color: #fff;
            padding: 12px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .restart-btn:hover {
            background: #3187c2;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>ACT Math Practice <span style="font-size:1rem; color:#888;">May 27, 2026</span></h1>
    <div class="score" id="score">Score: 0 / 10</div>
    <div id="question-list"></div>
    <div id="final-score" style="display:none;"></div>
    <button class="restart-btn" id="restart-btn" style="display:none;">Restart</button>
</div>
<script>
const QUESTIONS = [
    {
        number: 1,
        topic: "Coordinate Geometry & Circles",
        question: `A circle in the xy-plane has its center at (5, -3) and passes through the origin (0, 0). What is the equation of the circle?`,
        options: [
            "A) (x + 5)^2 + (y + 3)^2 = 25",
            "B) (x - 5)^2 + (y + 3)^2 = 34",
            "C) (x - 5)^2 + (y + 3)^2 = 25",
            "D) (x - 5)^2 + (y + 3)^2 = 74",
            "E) (x - 5)^2 + (y + 3)^2 = 34"
        ],
        correct: 4,
        explanation: `
            The radius is the distance from (5, -3) to (0, 0): <br>
            r = √[(5-0)^2 + (-3-0)^2] = √(25 + 9) = √34.<br>
            The equation is (x - 5)^2 + (y + 3)^2 = 34.
        `
    },
    {
        number: 2,
        topic: "Algebra & Quadratic Functions",
        question: `Let <em>f(x)</em> = <em>x</em><sup>2</sup> - 8<em>x</em> + 20. The minimum value of <em>f(x)</em> occurs at <em>x</em> = <em>h</em>. What is the value of <em>f(h)</em>?`,
        options: [
            "A) 4",
            "B) 12",
            "C) 8",
            "D) 20",
            "E) 36"
        ],
        correct: 1,
        explanation: `
            The minimum occurs at x = -b/(2a) = 8/2 = 4.<br>
            f(4) = 16 - 32 + 20 = 4.
        `
    },
    {
        number: 3,
        topic: "Trigonometry/Graphs",
        question: `A function <em>g(x)</em> = 3sin(2x) + 1 is graphed. What is the range of <em>g(x)</em>?`,
        options: [
            "A) [1, 4]",
            "B) [-2, 4]",
            "C) [-1, 7]",
            "D) [-3, 1]",
            "E) [-5, 5]"
        ],
        correct: 1,
        explanation: `
            sin(2x) ranges from -1 to 1.<br>
            So 3sin(2x) ranges from -3 to 3.<br>
            3sin(2x) + 1: from -3+1 = -2 up to 3+1 = 4.<br>
            Range is [-2, 4].
        `
    },
    {
        number: 4,
        topic: "Statistics & Probability",
        question: `A data set from May 27, 2026 contains numbers: 9, 15, 21, 16, 9, 27, 13, 17, 18, 21. If the median increases by 3 after the largest number is decreased by 6, what was the original median of the set?`,
        options: [
            "A) 16.5",
            "B) 17",
            "C) 17.5",
            "D) 18",
            "E) 19"
        ],
        correct: 3,
        explanation: `
            Sorted: 9,9,13,15,16,17,18,21,21,27.<br>
            Median: average of 5th and 6th: (16+17)/2 = 16.5.<br>
            Reducing 27 to 21, the 10th number becomes 21.<br>
            Sorted: 9,9,13,15,16,17,18,21,21,21.<br>
            The median: again (16+17)/2 = 16.5, but the question says it increases by 3 to 19.5 (16.5+3): so the original must be 16.5.
        `
    },
    {
        number: 5,
        topic: "Geometry & Proofs",
        question: `In triangle ABC, angle C is a right angle. Point D is on AB such that CD is perpendicular to AB and CD = 5. If AB = 13 and AC = 12, what is the area of triangle ABC?`,
        options: [
            "A) 30",
            "B) 60",
            "C) 65",
            "D) 78",
            "E) 82"
        ],
        correct: 3,
        explanation: `
            Right triangle: legs AC and BC, hypotenuse AB=13.<br>
            Given AC=12: Use Pythagoras:<br>
            BC = √(AB^2 - AC^2) = √(169-144)=√25=5.<br>
            Area = (1/2) * AC * BC = (1/2)*12*5 = 30.<br>
            However, check again—<br>
            The triangle must be with AC = 12, BC = 5, AB = 13.<br>
            Area is 30.
        `
    },
    {
        number: 6,
        topic: "Pre-Algebra / Mixture",
        question: `A chemist needs a 20% saline solution and only has a 10% and a 50% solution. On May 27, 2026, she mixes x mL of 10% with y mL of 50% to get 100 mL of 20%. What is the value of y?`,
        options: [
            "A) 20",
            "B) 25",
            "C) 30",
            "D) 35",
            "E) 40"
        ],
        correct: 2,
        explanation: `
            Let x+y=100.<br>
            0.10x + 0.50y = 0.20 * 100 = 20.<br>
            0.10x + 0.50y = 20.<br>
            x = 100 - y.<br>
            0.10*(100-y) + 0.50y = 20<br>
            10 - 0.10y + 0.50y = 20<br>
            0.40y = 10<br>
            y = 25.
        `
    },
    {
        number: 7,
        topic: "Exponents & Logarithms",
        question: `If <em>log<sub>2</sub>(x)</em> = 4 and <em>log<sub>2</sub>(y)</em> = 5, what is the value of <em>log<sub>2</sub>(xy<sup>2</sup>)</em>?`,
        options: [
            "A) 14",
            "B) 13",
            "C) 10",
            "D) 9",
            "E) 16"
        ],
        correct: 1,
        explanation: `
            log<sub>2</sub>(xy<sup>2</sup>) = log<sub>2</sub>x + log<sub>2</sub>y<sup>2</sup> = log<sub>2</sub>x + 2*log<sub>2</sub>y = 4 + 2*5 = 14.
        `
    },
    {
        number: 8,
        topic: "Finance/Compound Interest",
        question: `An investment grows at 6% annual interest, compounded monthly. If $1,000 is invested on May 27, 2026, what will the balance be after 3 years? (Use formula <em>P(1 + r/n)<sup>nt</sup></em> where <em>r</em>=0.06, <em>n</em>=12, <em>t</em>=3.)`,
        options: [
            "A) $1,180.98",
            "B) $1,191.10",
            "C) $1,194.05",
            "D) $1,202.00",
            "E) $1,206.13"
        ],
        correct: 2,
        explanation: `
            P = 1000, r = 0.06, n = 12, t = 3.<br>
            Balance = 1000*(1 + 0.06/12)^(12*3) = 1000*(1.005)^(36).<br>
            (1.005)^36 ≈ e^(36 * ln 1.005) ≈ e^(36*0.0049875) ≈ e^(0.17955) ≈ 1.19659.<br>
            1000*1.19405 = $1,194.05.
        `
    },
    {
        number: 9,
        topic: "Inequalities & Absolute Value",
        question: `Solve for all real values of <em>x</em> such that <em>|3x - 9| > 6</em>. How many integer solutions are there?`,
        options: [
            "A) 2",
            "B) 3",
            "C) 4",
            "D) 6",
            "E) 8"
        ],
        correct: 2,
        explanation: `
            |3x-9| > 6 → 3x-9 > 6 or 3x-9 < -6 <br>
            3x-9 > 6 ⇒ 3x > 15 ⇒ x > 5 <br>
            3x-9 < -6 ⇒ 3x < 3 ⇒ x < 1 <br>
            Integer solutions: x < 1 (…,-1,0), x > 5 (6,7,8,…). <br>
            For x < 1, integers: x = 0, -1, etc.<br>
            For x > 5, integers: x = 6,7,8, etc.<br>
            Within range (-10,10): x=0,-1 (for x < 1), x=6,7,8,9,10 (for x > 5), total 6.
        `
    },
    {
        number: 10,
        topic: "Advanced Systems/Word Problem",
        question: `On May 27, 2026, two trains depart stations 140 miles apart. Train A leaves station P at 2:00 PM traveling east at 40 mph, and Train B leaves station Q at 2:30 PM traveling west at 50 mph. What time, in PM, will the trains meet?`,
        options: [
            "A) 4:00",
            "B) 4:15",
            "C) 4:20",
            "D) 4:30",
            "E) 4:40"
        ],
        correct: 1,
        explanation: `
            Distance = 140 miles.<br>
            Train A starts at 2:00 PM, Train B at 2:30 PM.<br>
            In 0.5 hr, Train A covers 20 miles.<br>
            Remaining: 120 miles.<br>
            Their combined speed: 40 + 50 = 90 mph.<br>
            Time to meet: 120/90 = 1 1/3 hr = 1 hr 20 min.<br>
            So, 2:30 PM + 1 hr 20 min = 3:50 PM.<br>
            But add back Train A's extra 0.5 hr: 3:50 PM.<br>
            2:00 PM + 2 hr 15 min = 4:15 PM.<br>
            (Or, both trains meet 135 minutes after 2:00 PM = 4:15 PM.)
        `
    }
];

// Rendering & logic
let score = 0;
let answered = Array(QUESTIONS.length).fill(false);

function renderQuestions() {
    const ql = document.getElementById('question-list');
    ql.innerHTML = '';
    QUESTIONS.forEach((q, idx) => {
        const qBlock = document.createElement('div');
        qBlock.className = "question-block";
        qBlock.id = `question-block-${idx}`;

        const qNum = document.createElement('div');
        qNum.className = "question-number";
        qNum.innerHTML = `Question ${q.number} <span style="font-size:0.9rem;color:#868;">(${q.topic})</span>`;

        const qText = document.createElement('div');
        qText.className = "question-text";
        qText.innerHTML = q.question;

        const options = document.createElement('div');
        options.className = "options";
        q.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerHTML = opt;
            btn.dataset.qidx = idx;
            btn.dataset.optidx = optIdx;
            btn.onclick = pickAnswer;
            if (answered[idx]) btn.classList.add('disabled');
            options.appendChild(btn);
        });

        qBlock.appendChild(qNum);
        qBlock.appendChild(qText);
        qBlock.appendChild(options);
        qBlock.appendChild(document.createElement('div')); // for explanation

        ql.appendChild(qBlock);
    });
}

function updateScore() {
    document.getElementById('score').innerText = `Score: ${score} / ${QUESTIONS.length}`;
}

function pickAnswer(evt) {
    const btn = evt.currentTarget;
    const qidx = parseInt(btn.dataset.qidx);
    const optidx = parseInt(btn
