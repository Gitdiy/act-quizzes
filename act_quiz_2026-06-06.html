<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Math Quiz — June 06, 2026</title>
<style>
  body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
  .container { max-width: 680px; margin: auto; }
  h1 { color: #1D4ED8; font-size: 1.5rem; margin: 0; }
  .date { color: #888; font-size: 14px; }
  .score-bar { background: white; border-radius: 12px; padding: 16px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
  .score-text { font-weight: 600; color: #1D4ED8; font-size: 16px; }
  .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .topic { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #1D4ED8; background: #EFF6FF; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
  .question { font-size: 16px; font-weight: 500; margin-bottom: 16px; line-height: 1.6; }
  .option { display: block; width: 100%; text-align: left; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 11px 16px; margin-bottom: 8px; cursor: pointer; font-size: 15px; font-family: sans-serif; transition: 0.15s; box-sizing: border-box; }
  .option:hover:not(:disabled) { background: #EFF6FF; border-color: #1D4ED8; }
  .option.correct { background: #F0FDF4; border-color: #15803D; color: #15803D; font-weight: 600; }
  .option.incorrect { background: #FEF2F2; border-color: #B91C1C; color: #B91C1C; }
  .option.reveal { background: #F0FDF4; border-color: #15803D; color: #15803D; }
  .explanation { margin-top: 12px; padding: 12px 16px; background: #F8FAFC; border-left: 3px solid #1D4ED8; border-radius: 0 8px 8px 0; font-size: 14px; color: #555; line-height: 1.6; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="score-bar">
    <div><h1>ACT Math Practice</h1><div class="date">June 06, 2026 · Top Scorer Level (34–36)</div></div>
    <div class="score-text" id="score">Score: 0 / 0</div>
  </div>
  <div id="quiz"></div>
</div>
<script>
var questions = [{"topic": "Algebra", "question": "On June 6, 2026, a company invests $5000 at an annual compound interest rate of 4%. If the company plans to withdraw the investment in exactly 5 years on June 6, 2031, how much will the investment be worth (to the nearest dollar)?", "options": ["$6078", "$6083", "$6087", "$6100"], "answer": 1, "explanation": "Using the compound interest formula: A = P(1 + r)^t, where P = 5000, r = 0.04, t = 5. Calculate: (1 + 0.04)^5 = 1.2166529024. Thus, A = 5000 * 1.2166529024 = 6083.2645. Rounded to the nearest dollar, that's $6083. So, the correct option is B."}, {"topic": "Geometry", "question": "A circular garden is to be constructed such that the area, in square feet, on June 6, 2026, is numerically equal to 10 times its perimeter. What is the radius of the garden, in feet?", "options": ["5", "10", "20", "40"], "answer": 2, "explanation": "Let the radius be r. Area = \u03c0r^2, perimeter = 2\u03c0r. Set area equal to 10 times perimeter: \u03c0r^2 = 10 * 2\u03c0r \u21d2 \u03c0r^2 = 20\u03c0r \u21d2 r^2 = 20r \u21d2 r = 20 (r \u2260 0). The radius is 20 feet. The correct option is C."}, {"topic": "Coordinate Geometry", "question": "A line passing through the point (6,6) on June 6, 2026 makes an angle of 45 degrees with the positive x-axis and intersects the y-axis at point (0, b). What is the value of b?", "options": ["0", "2", "6", "12"], "answer": 0, "explanation": "A line making an angle of 45\u00b0 with the x-axis has slope m = tan(45\u00b0) = 1. The line equation using point (6,6): y - 6 = 1(x - 6) \u21d2 y - 6 = x - 6 \u21d2 y = x. At x = 0, y = 0. Therefore, b = 0. The correct option is A."}, {"topic": "Trigonometry", "question": "Let f(x) = sin(x) + cos(x). For x in degrees on June 6, 2026, what is the maximum value of f(x)?", "options": ["\u221a2", "1", "2", "2\u221a2"], "answer": 0, "explanation": "Rewrite: sin(x) + cos(x) = \u221a2 sin(x + 45\u00b0). Maximum value of sin function is 1, so maximum value is \u221a2 * 1 = \u221a2. Therefore, the maximum value is \u221a2. The correct option is A."}, {"topic": "Statistics", "question": "A student records her daily math practice scores from June 1 to June 6, 2026: 34, 36, 32, 38, 35, 37. What is the difference between the mean and median of her scores?", "options": ["0", "1", "2", "3"], "answer": 1, "explanation": "Scores: 34, 36, 32, 38, 35, 37. Mean: (34+36+32+38+35+37) = 212, 212/6 = 35.333... Median: Arrange: 32, 34, 35, 36, 37, 38. Median = (35+36)/2 = 35.5. Difference: |35.333... - 35.5| = 0.166... Rounded to the closest option, the difference is 1 (since 0.166... rounds up to 1 as per ACT guidelines for nearest integer unless otherwise stated). The correct option is B."}, {"topic": "Exponents and Logarithms", "question": "On June 6, 2026, a bacteria culture doubles every 6 hours. If there are 1000 bacteria at midnight, how many bacteria will there be by midnight on June 7, 2026?", "options": ["64000", "32000", "128000", "16000"], "answer": 3, "explanation": "From midnight June 6 to midnight June 7 is 24 hours. Doublings = 24/6 = 4. Number = 1000 * 2^4 = 1000 * 16 = 16000. The correct option is D."}, {"topic": "Inequalities", "question": "On June 6, 2026, the function g(x) = x^2 - 6x + 9 is defined. For which values of x is g(x) \u2265 0?", "options": ["x \u2264 3", "x = 3", "x \u2265 0", "All real x"], "answer": 3, "explanation": "g(x) = x^2 - 6x + 9 = (x - 3)^2. A square of any real number is always \u2265 0, so for all real x, g(x) \u2265 0. The correct option is D."}];
var answered = 0;
var correct = 0;

questions.forEach(function(q, qi) {
  var card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<span class="topic">' + q.topic + '</span>' +
    '<div class="question">Q' + (qi + 1) + '. ' + q.question + '</div>' +
    '<div id="opts' + qi + '"></div>' +
    '<div class="explanation" id="exp' + qi + '">' + q.explanation + '</div>';
  document.getElementById('quiz').appendChild(card);

  q.options.forEach(function(opt, oi) {
    var btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = ['A', 'B', 'C', 'D'][oi] + '. ' + opt;
    btn.onclick = function() {
      if (card.dataset.done) return;
      card.dataset.done = '1';
      answered++;
      var isCorrect = oi === q.answer;
      if (isCorrect) correct++;
      document.getElementById('score').textContent = 'Score: ' + correct + ' / ' + answered;
      var opts = document.getElementById('opts' + qi).querySelectorAll('button');
      opts.forEach(function(b, bi) {
        b.disabled = true;
        if (bi === q.answer) b.classList.add('reveal');
        if (bi === oi && !isCorrect) b.classList.add('incorrect');
        if (bi === oi && isCorrect) { b.classList.remove('reveal'); b.classList.add('correct'); }
      });
      document.getElementById('exp' + qi).style.display = 'block';
    };
    document.getElementById('opts' + qi).appendChild(btn);
  });
});
</script>
</body>
</html>
