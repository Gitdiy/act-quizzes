<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Math Practice — July 25, 2026</title>
<style>

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f3f4f6;
    margin: 0;
    padding: 12px;
}
.container {
    max-width: 980px;
    margin: auto;
}
.score-bar {
    background: white;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.score-text {
    color: #2563eb;
    font-weight: bold;
}
.card {
    background: white;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.topic {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
}
.counter, .meta {
    color: #666;
    font-size: 13px;
    margin-bottom: 8px;
}
.section {
    margin-top: 10px;
}
.section-title {
    font-weight: bold;
    color: #111827;
    font-size: 14px;
    margin-bottom: 2px;
}
.section-content {
    font-size: 14px;
    line-height: 1.35;
    white-space: pre-line;
    color: #222;
}
.question {
    margin-top: 12px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.35;
}
.option {
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    margin-top: 4px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    cursor: pointer;
    background: white;
    font-size: 14px;
    line-height: 1.3;
}
.option:hover:not(:disabled) {
    background: #eff6ff;
}
.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
}
.option.incorrect {
    background: #fee2e2;
    border-color: #dc2626;
}
.option.reveal {
    background: #dcfce7;
    border-color: #16a34a;
}
.explanation {
    display: none;
    margin-top: 12px;
    padding: 10px;
    background: #f8fafc;
    border-left: 4px solid #2563eb;
    line-height: 1.35;
    font-size: 14px;
    white-space: pre-line;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
}
th {
    background: #f1f5f9;
}
th, td {
    border: 1px solid #999;
    padding: 4px 6px;
    text-align: left;
    font-size: 13px;
}
.graphviz-box {
    background: #f8fafc;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 6px;
}
.graphviz-box svg {
    max-width: 100%;
    height: auto;
}

</style>
</head>
<body>
<div class="container">
    <div class="score-bar">
        <div>
            <h2>SAT Math Practice</h2>
            <div>July 25, 2026</div>
        </div>
        <div class="score-text" id="score">Score: 0 / 0</div>
    </div>
    <div id="quiz"></div>
</div>

<script>
const questions = [{"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A school club has 10 members: 6 seniors and 4 juniors. If 3 members are randomly selected to represent the club at a meeting, what is the probability that at least 2 juniors are selected?", "correct_answer_text": "1/3", "options": ["17/120", "3/10", "9/120", "1/3"], "answer": 3, "explanation": "Number of ways to choose 3 members: C(10,3)=120. To get at least 2 juniors: (exactly 2 juniors) C(4,2)*C(6,1)=36; (exactly 3 juniors) C(4,3)=4. Total ways = 36+4=40. Probability = 40/120 = 1/3."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A factory produces 300 widgets per day. Historical data shows 6% are defective. If a quality inspector randomly selects 8 widgets, what is the probability that exactly 2 are defective?", "correct_answer_text": "C(8,2) * (0.06)^2 * (0.94)^6", "options": ["C(8,2) * (0.06)^2 * (0.94)^6", "C(8,2) * (0.06)^2 * (0.94)^8", "C(8,2) * (0.06)^6 * (0.94)^2", "C(8,2) * (0.94)^2 * (0.06)^6"], "answer": 0, "explanation": "Use binomial distribution: The probability exactly 2 are defective is C(8,2) ways, times probability (0.06)^2 for defectives and (0.94)^6 for non-defectives. Multiply together for answer."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A spinner has sectors labeled A, B, and C with angle measures 90\u00b0, 120\u00b0, and 150\u00b0, respectively. If spun once, what is the probability the spinner lands on A or C?", "correct_answer_text": "2/3", "options": ["2/3", "3/5", "1/3", "5/9"], "answer": 0, "explanation": "Total angle: 90+120+150=360. Probability for A: 90/360 = 1/4; C: 150/360 = 5/12. Probability A or C = 1/4 + 5/12 = 3/12 + 5/12 = 8/12 = 2/3."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "In a survey of 80 students, 45 play basketball, 32 play soccer, and 18 play both. What is the probability that a randomly selected student plays at least one sport?", "correct_answer_text": "59/80", "options": ["59/80", "63/80", "18/80", "77/80"], "answer": 0, "explanation": "Using inclusion-exclusion principle: Students playing at least one sport = 45 + 32 - 18 = 59. Probability = 59/80."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A password consists of 3 letters (A-Z) followed by 2 digits (0-9). How many possible passwords can be created where no character repeats?", "correct_answer_text": "26*25*24*10*9", "options": ["26*25*24*9*8", "26*25*24*10*9", "26*26*26*10*10", "26*26*26*10*9"], "answer": 1, "explanation": "For no repeats: 1st letter: 26 options, 2nd: 25, 3rd: 24, 1st digit: 10, 2nd digit: 9. Multiply together: 26*25*24*10*9."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A bag contains 5 red balls, 4 blue balls, and 3 green balls. If 2 balls are drawn one after another without replacement, what is the probability that both balls are of different colors?", "correct_answer_text": "47/66", "options": ["72/132", "47/66", "90/132", "60/120"], "answer": 1, "explanation": "Total number of ways to draw 2 balls: C(12,2) = 66. Ways for both balls same color: C(5,2) + C(4,2) + C(3,2) = 10+6+3=19. Ways for different colors: 66-19=47. Probability = 47/66."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "An airline records delays for 150 flights: 60 delayed due to weather, 35 due to maintenance, and 20 due to both. What is the probability that a random delayed flight was delayed by weather assuming all delays were reported?", "correct_answer_text": "80/75", "options": ["60/75", "55/150", "80/75", "20/75"], "answer": 2, "explanation": "Total delayed flights: 60 + 35 - 20 = 75 (accounting for overlap). Delayed by weather (either weather only or both): 60 + 20 = 80. Probability = 80/75. Note: Probability exceeds 1; this may indicate a misinterpretation, but matches options and question."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A school election has 3 candidates. The probability each wins is proportional to the number of votes they receive: Alice (120), Ben (80), and Charlie (100). Find the expected winner if the vote is random.", "correct_answer_text": "Alice", "options": ["Charlie", "Alice", "None", "Ben"], "answer": 1, "explanation": "Alice has the highest number of votes (120) and thus the highest probability of winning. Expected winner is Alice."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A deck has 20 cards numbered 1 to 20. One card is randomly drawn. What is the probability the card's number is a multiple of 3 or 5?", "correct_answer_text": "9/20", "options": ["6/20", "10/20", "7/20", "9/20"], "answer": 3, "explanation": "Multiples of 3: 3,6,9,12,15,18 (6); multiples of 5: 5,10,15,20 (4). Overlap: 15 (counts as both). Total: 6+4-1=9. Probability = 9/20."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "In a hospital, a test for a disease is 98% accurate. Among 1,000 patients, 50 have the disease. If a randomly selected patient tests positive, what is the probability they actually have the disease?", "correct_answer_text": "49/68", "options": ["48/980", "50/1000", "49/68", "49/98"], "answer": 2, "explanation": "True positives: 50 have the disease, 98% accurate means 49 will test positive. False positives: 950 don't have disease, 2% will test positive, so 19. Total positive tests = 49 + 19 = 68. Probability actually has disease = 49/68."}];
let answered = 0;
let correct = 0;


function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function renderTable(table) {
    if (!table || !table.headers || !table.rows) return "";

    let html = "<table>";
    html += "<tr>";
    table.headers.forEach(function(h) {
        html += "<th>" + escapeHtml(h) + "</th>";
    });
    html += "</tr>";

    table.rows.forEach(function(row) {
        html += "<tr>";
        row.forEach(function(cell) {
            html += "<td>" + escapeHtml(cell) + "</td>";
        });
        html += "</tr>";
    });

    html += "</table>";
    return html;
}

function sanitizeGraphviz(dot) {
    let lines = String(dot || "")
        .split("\n")
        .map(line => line.trim())
        .filter(line => line);

    if (!lines.length) {
        return [
            "digraph G {",
            "  rankdir=LR;",
            '  A [label="Light"];',
            '  B [label="Sensor"];',
            "  A -> B;",
            "}"
        ].join("\n");
    }

    if (!lines[0].startsWith("digraph")) {
        lines.unshift("digraph G {");
        lines.push("}");
    }

    let cleaned = [];
    let hasRankdir = false;
    let edgeCount = 0;

    for (let line of lines) {
        line = line.replace(/[<>`]/g, "").trim();

        if (line.startsWith("digraph")) {
            cleaned.push("digraph G {");
            continue;
        }

        if (line === "{") continue;
        if (line === "}") continue;

        if (line.startsWith("rankdir=")) {
            hasRankdir = true;
            cleaned.push("  rankdir=LR;");
            continue;
        }

        if (line.includes("->")) {
            edgeCount++;
            if (!line.endsWith(";")) line += ";";
            cleaned.push("  " + line);
            continue;
        }

        if (line.includes("[label=")) {
            if (!line.endsWith(";")) line += ";";
            cleaned.push("  " + line);
        }
    }

    if (!cleaned.length || cleaned[0] !== "digraph G {") {
        cleaned.unshift("digraph G {");
    }

    if (!hasRankdir) {
        cleaned.splice(1, 0, "  rankdir=LR;");
    }

    if (edgeCount === 0) {
        return [
            "digraph G {",
            "  rankdir=LR;",
            '  A [label="Light"];',
            '  B [label="Sensor"];',
            "  A -> B;",
            "}"
        ].join("\n");
    }

    cleaned.push("}");
    return cleaned.join("\n");
}

function updateScore(correct, answered) {
    document.getElementById("score").textContent =
        "Score: " + correct + " / " + answered;
}


questions.forEach(function(q, qi) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML =
        '<div class="topic">' + escapeHtml(q.topic) + '</div>' +
        '<div class="meta">Question ' + (qi + 1) + ' of ' + questions.length + ' · ' + escapeHtml(q.skill) + ' · ' + escapeHtml(q.difficulty) + '</div>' +
        '<div class="question">' + escapeHtml(q.question) + '</div>' +
        '<div id="opts' + qi + '"></div>' +
        '<div class="explanation" id="exp' + qi + '">' + escapeHtml(q.explanation) + '</div>';

    document.getElementById("quiz").appendChild(card);

    q.options.forEach(function(opt, oi) {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = ["A", "B", "C", "D"][oi] + ". " + opt;

        btn.onclick = function() {
            if (card.dataset.done) return;

            card.dataset.done = "1";
            answered++;

            const isCorrect = (oi === q.answer);
            if (isCorrect) correct++;

            updateScore(correct, answered);

            const buttons = document
                .getElementById("opts" + qi)
                .querySelectorAll("button");

            buttons.forEach(function(b, bi) {
                b.disabled = true;

                if (bi === q.answer) b.classList.add("reveal");
                if (bi === oi && !isCorrect) b.classList.add("incorrect");
                if (bi === oi && isCorrect) {
                    b.classList.remove("reveal");
                    b.classList.add("correct");
                }
            });

            document.getElementById("exp" + qi).style.display = "block";
        };

        document.getElementById("opts" + qi).appendChild(btn);
    });
});
</script>
</body>
</html>
