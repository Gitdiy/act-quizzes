<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Math Practice — July 25, 2026</title>
<style>

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f3f4f6;
    margin: 0;
    padding: 12px;
}
.container {
    max-width: 980px;
    margin: auto;
}
.score-bar {
    background: white;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.score-text {
    color: #2563eb;
    font-weight: bold;
}
.card {
    background: white;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.topic {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
}
.counter, .meta {
    color: #666;
    font-size: 13px;
    margin-bottom: 8px;
}
.section {
    margin-top: 10px;
}
.section-title {
    font-weight: bold;
    color: #111827;
    font-size: 14px;
    margin-bottom: 2px;
}
.section-content {
    font-size: 14px;
    line-height: 1.35;
    white-space: pre-line;
    color: #222;
}
.question {
    margin-top: 12px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.35;
}
.option {
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    margin-top: 4px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    cursor: pointer;
    background: white;
    font-size: 14px;
    line-height: 1.3;
}
.option:hover:not(:disabled) {
    background: #eff6ff;
}
.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
}
.option.incorrect {
    background: #fee2e2;
    border-color: #dc2626;
}
.option.reveal {
    background: #dcfce7;
    border-color: #16a34a;
}
.explanation {
    display: none;
    margin-top: 12px;
    padding: 10px;
    background: #f8fafc;
    border-left: 4px solid #2563eb;
    line-height: 1.35;
    font-size: 14px;
    white-space: pre-line;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
}
th {
    background: #f1f5f9;
}
th, td {
    border: 1px solid #999;
    padding: 4px 6px;
    text-align: left;
    font-size: 13px;
}
.graphviz-box {
    background: #f8fafc;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 6px;
}
.graphviz-box svg {
    max-width: 100%;
    height: auto;
}

</style>
</head>
<body>
<div class="container">
    <div class="score-bar">
        <div>
            <h2>SAT Math Practice</h2>
            <div>July 25, 2026</div>
        </div>
        <div class="score-text" id="score">Score: 0 / 0</div>
    </div>
    <div id="quiz"></div>
</div>

<script>
const questions = [{"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "In a survey of 150 students, 68 play basketball, 84 play soccer, and 25 play both. If a student is chosen at random, what is the probability the student plays at least one of the two sports?", "correct_answer_text": "127/150", "options": ["127/150", "152/150", "93/150", "109/150"], "answer": 0, "explanation": "Apply the Inclusion-Exclusion Principle: Number who play at least one = 68 (basketball) + 84 (soccer) - 25 (both) = 127 students. Probability = 127/150."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A spinner is divided into 5 equal sectors labeled A, B, C, D, and E. In 200 spins, sector B shows up 38 times. What is the experimental probability of spinning B and how does it compare to the theoretical probability?", "correct_answer_text": "38/200", "options": ["38/200", "40/200", "0", "1/5"], "answer": 0, "explanation": "Experimental probability = number of times B occurs / total spins = 38/200. Theoretical probability = 1/5 (since the spinner has five equal sectors). The experimental probability is 38/200."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A password is formed using exactly 3 distinct digits (0\u20139) followed by 1 distinct uppercase English letter (A\u2013Z). How many different passwords are possible?", "correct_answer_text": "18720", "options": ["7200", "18720", "24360", "7020"], "answer": 1, "explanation": "There are 10 digits. The number of ways to pick 3 distinct digits and arrange them is 10P3 = 10\u00d79\u00d78 = 720. For the letter, there are 26 choices. Total: 720\u00d726 = 18720."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "For a school club, 7 students are running for president, vice-president, and secretary. How many ways can these offices be filled if each person holds only one office?", "correct_answer_text": "210", "options": ["210", "420", "840", "105"], "answer": 0, "explanation": "Order matters, so it's a permutation: 7P3 = 7\u00d76\u00d75 = 210 ways."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A manufacturing plant produces 500 bolts daily. It is known that 12 bolts are defective. If two bolts are selected at random without replacement, what is the probability that both are defective?", "correct_answer_text": "132/249500", "options": ["12/500", "11/500", "12/499", "132/249500"], "answer": 3, "explanation": "The first pick: 12/500, the second (without replacement): 11/499. Multiply: (12/500)*(11/499) = 132/249500."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A treasurer randomly selects 2 members from a group of 4 teachers and 6 students to form a committee. What is the probability that both selected are students?", "correct_answer_text": "1/3", "options": ["3/10", "1/15", "2/45", "1/3"], "answer": 3, "explanation": "Ways to choose any 2: C(10,2) = 45. Ways to choose 2 students: C(6,2) = 15. Probability: 15/45 = 1/3."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "At a hospital, 72 patients are tested for a virus. 21 test positive, including 8 who also have a fever. If a patient who tested positive is selected at random, what is the probability that this patient has a fever?", "correct_answer_text": "8/21", "options": ["13/21", "8/21", "8/72", "7/72"], "answer": 1, "explanation": "There are 21 positive patients; 8 have a fever. Probability = 8/21."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "In a card game, you pay $2 to play. If you draw a red card, you win $5. If you draw a black card, you win nothing. What is the expected value for a single play with a standard 52-card deck?", "correct_answer_text": "-$0.50", "options": ["$1.50", "$0", "-$0.50", "$3"], "answer": 2, "explanation": "Probability of red card: 26/52 = 1/2. Expected return: (1/2)*$5 + (1/2)*$0 - $2 = $2.50 - $2 = -$0.50."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A weather forecast shows 40% chance of rain on Monday and 70% on Tuesday. If the rain on each day is independent, what is the probability that it rains on at least one day?", "correct_answer_text": "0.82", "options": ["0.18", "0.7", "0.82", "0.28"], "answer": 2, "explanation": "Probability it does NOT rain both days: 0.6\u00d70.3 = 0.18. At least one day: 1-0.18 = 0.82."}, {"topic": "SAT Math", "skill": "probability", "difficulty": "hard", "question": "A number x is randomly chosen between 1 and 20, inclusive. What is the probability that x is a prime number?", "correct_answer_text": "2/5", "options": ["9/20", "2/5", "15/20", "8/20"], "answer": 1, "explanation": "There are 8 primes between 1 and 20: 2,3,5,7,11,13,17,19. Probability: 8/20 = 2/5."}];
let answered = 0;
let correct = 0;


function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function renderTable(table) {
    if (!table || !table.headers || !table.rows) return "";

    let html = "<table>";
    html += "<tr>";
    table.headers.forEach(function(h) {
        html += "<th>" + escapeHtml(h) + "</th>";
    });
    html += "</tr>";

    table.rows.forEach(function(row) {
        html += "<tr>";
        row.forEach(function(cell) {
            html += "<td>" + escapeHtml(cell) + "</td>";
        });
        html += "</tr>";
    });

    html += "</table>";
    return html;
}

function sanitizeGraphviz(dot) {
    let lines = String(dot || "")
        .split("\n")
        .map(line => line.trim())
        .filter(line => line);

    if (!lines.length) {
        return [
            "digraph G {",
            "  rankdir=LR;",
            '  A [label="Light"];',
            '  B [label="Sensor"];',
            "  A -> B;",
            "}"
        ].join("\n");
    }

    if (!lines[0].startsWith("digraph")) {
        lines.unshift("digraph G {");
        lines.push("}");
    }

    let cleaned = [];
    let hasRankdir = false;
    let edgeCount = 0;

    for (let line of lines) {
        line = line.replace(/[<>`]/g, "").trim();

        if (line.startsWith("digraph")) {
            cleaned.push("digraph G {");
            continue;
        }

        if (line === "{") continue;
        if (line === "}") continue;

        if (line.startsWith("rankdir=")) {
            hasRankdir = true;
            cleaned.push("  rankdir=LR;");
            continue;
        }

        if (line.includes("->")) {
            edgeCount++;
            if (!line.endsWith(";")) line += ";";
            cleaned.push("  " + line);
            continue;
        }

        if (line.includes("[label=")) {
            if (!line.endsWith(";")) line += ";";
            cleaned.push("  " + line);
        }
    }

    if (!cleaned.length || cleaned[0] !== "digraph G {") {
        cleaned.unshift("digraph G {");
    }

    if (!hasRankdir) {
        cleaned.splice(1, 0, "  rankdir=LR;");
    }

    if (edgeCount === 0) {
        return [
            "digraph G {",
            "  rankdir=LR;",
            '  A [label="Light"];',
            '  B [label="Sensor"];',
            "  A -> B;",
            "}"
        ].join("\n");
    }

    cleaned.push("}");
    return cleaned.join("\n");
}

function updateScore(correct, answered) {
    document.getElementById("score").textContent =
        "Score: " + correct + " / " + answered;
}


questions.forEach(function(q, qi) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML =
        '<div class="topic">' + escapeHtml(q.topic) + '</div>' +
        '<div class="meta">Question ' + (qi + 1) + ' of ' + questions.length + ' · ' + escapeHtml(q.skill) + ' · ' + escapeHtml(q.difficulty) + '</div>' +
        '<div class="question">' + escapeHtml(q.question) + '</div>' +
        '<div id="opts' + qi + '"></div>' +
        '<div class="explanation" id="exp' + qi + '">' + escapeHtml(q.explanation) + '</div>';

    document.getElementById("quiz").appendChild(card);

    q.options.forEach(function(opt, oi) {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = ["A", "B", "C", "D"][oi] + ". " + opt;

        btn.onclick = function() {
            if (card.dataset.done) return;

            card.dataset.done = "1";
            answered++;

            const isCorrect = (oi === q.answer);
            if (isCorrect) correct++;

            updateScore(correct, answered);

            const buttons = document
                .getElementById("opts" + qi)
                .querySelectorAll("button");

            buttons.forEach(function(b, bi) {
                b.disabled = true;

                if (bi === q.answer) b.classList.add("reveal");
                if (bi === oi && !isCorrect) b.classList.add("incorrect");
                if (bi === oi && isCorrect) {
                    b.classList.remove("reveal");
                    b.classList.add("correct");
                }
            });

            document.getElementById("exp" + qi).style.display = "block";
        };

        document.getElementById("opts" + qi).appendChild(btn);
    });
});
</script>
</body>
</html>
